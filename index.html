<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>unicos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="unicos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="main" id="pgChats">
    <div class="banner" id="banner">
      <div class="bnTop">
        <div class="bnMe" id="meRow">
          <div class="bnAv"><div class="avatar" id="hdAvatar"></div><i class="dot"></i></div>
          <div class="meinfo"><div class="name" id="hdName"></div><div class="status">online</div></div>
        </div>
        <div class="cbtns">
          <button class="circle" id="qBtn" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
          <button class="circle" id="setBtn" aria-label="设置"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
        </div>
      </div>
    </div>
    <h1 class="big">Messages</h1>
    <div class="seg" id="tabs">
      <button class="on" data-t="chats">Chats</button>
      <button data-t="groups">Groups</button>
      <button data-t="friends">Friends</button>
    </div>
    <label class="search" id="qBar" hidden>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索聊天">
    </label>
    <div id="list"></div>
  </div>

  <div class="main" id="pgContacts" hidden>
    <div class="ctop">
      <h1>Contacts</h1>
      <div class="cbtns">
        <button class="circle" id="cSearch" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
        <button class="circle" id="boxBtn" aria-label="匿名箱"><svg viewBox="0 0 24 24"><path d="M6 4.500h12a3 3 0 013 3v7a3 3 0 01-3 3h-4.600L12 20l-1.400-2.500H6a3 3 0 01-3-3v-7a3 3 0 013-3z"/><path d="M9.800 9.300a2.200 2.200 0 114.400 0c0 1.300-2.200 1.600-2.200 3M12 14.700v.01"/></svg></button>
      </div>
    </div>
    <label class="search" id="cSearchBar" hidden>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="cq" type="search" placeholder="搜索联系人">
    </label>
    <div class="pills"><button class="addpill" id="addBtn"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M2.500 20c0-4 3.500-6 7.500-6M18 14v6M15 17h6"/></svg><span>Add Friend</span></button><button class="addpill" id="grpBtn"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-5.5 6.5-5.5s6.5 1.9 6.5 5.5M18 6v6M15 9h6"/></svg><span>New Group</span></button></div>
    <div id="cList"></div>
  </div>

  <div class="main" id="pgMoments" hidden></div>
  <div class="main" id="pgMe" hidden></div>
  <div class="main" id="pgAdd" hidden></div>
  <div class="main" id="pgSet" hidden></div>
  <div class="main" id="pgGrp" hidden></div>
  <div class="main" id="pgCouple" hidden></div>
  <div class="main" id="pgSaved" hidden></div>
  <div class="main" id="pgWallet" hidden></div>
  <div class="main" id="pgProfile" hidden></div>
  <div class="main" id="pgWorld" hidden></div>
<div class="main" id="pgAlbum" hidden></div>
<div class="main" id="pgRel" hidden></div>
<div class="main" id="pgMem" hidden></div>
<div class="main" id="pgBox" hidden></div>
<div class="main" id="pgFc" hidden></div>
<div class="main" id="pgPh" hidden></div>
<div class="main" id="pgChset" hidden></div>
<div class="main" id="pgTrail" hidden></div>

  <div class="chat" id="pgChat" hidden><div class="chHead banner" id="chHead"></div><div class="chScroll" id="chScroll"></div><div class="chBar"><button class="heartBtn" id="chPlus" aria-label="更多"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="heartBtn" id="chHeart" aria-label="心声"><svg viewBox="0 0 24 24"><path d="M12 20.500C6 16.500 3.500 13 3.500 9.500A4.500 4.500 0 0112 7.200 4.500 4.500 0 0120.500 9.500C20.500 13 18 16.500 12 20.500z"/></svg></button><textarea id="chIn" rows="1" enterkeyhint="send" placeholder="Message…"></textarea><button class="sendBtn" id="chSend" aria-label="发送" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
  <div id="actWrap" hidden><div class="scrim" id="actScrim"></div><div class="sheet" id="actSheet"></div></div>
  <div id="sheetWrap" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div></div>

  <nav id="nav">
    <button class="on" data-p="chats"><span>CHATS</span></button>
    <button data-p="contacts"><span>CONTACTS</span></button>
    <button data-p="moments"><span>MOMENTS</span></button>
    <button data-p="me"><span>ME</span></button>
  </nav>
  <nav id="cnav" hidden>
    <button class="on" data-c="home"><span>HOME</span></button>
    <button data-c="cal"><span>CALENDAR</span></button>
  </nav>
</div>

<script id="config">
/* ============================================================
   CONFIG 配置区：以后改默认值、内置词，只改这一块，不用动下面的界面代码
   ============================================================ */
// 版本号：每次更新文件时改这里（检查更新就是靠对比它）
window.APP_VERSION="1.6.5";

window.CONFIG={
  // 默认个人资料（用户自己改过的会存在浏览器里，优先于这里）
  profile:{name:"Nana",handle:"@_septemberthird",bio:"take me somewhere far away from here.",fans:"19k",avatar:"",persona:"",bg:"",uid:"",real:""},

  // 默认设置（API 地址、Key 等不要写在这里，在 App 的 Settings 里填，避免传到 GitHub）
  settings:{api:{base:"",key:"",model:"",temp:"0.8",max:"1024",ctx:"30"},voice:{key:"",voice:"",model:"eleven_multilingual_v2"},img:{base:"",key:"",model:"",size:"1024x1024",pos:"",neg:""},vision:{base:"",key:"",model:"",frames:"6"},stt:{base:"",key:"",model:"whisper-1",lang:""},theme:"system",lastBackup:0},

  // 内置词（提示词模板）。{{...}} 会在发送前被替换成真实内容
  // 可用变量：{{user}} 用户昵称  {{userPersona}} 用户人设  {{char}} 角色名  {{charDesc}} 角色描述
  // 记忆库的默认类型（可以在添加记忆时再新建别的类型）
  memoryTypes:["重要","日常","约定","喜好"],

  prompts:{
    system:"你是{{char}}，正在和{{user}}聊天。\n\n【你的设定】\n{{charDesc}}\n\n【对方的信息】\n{{userPersona}}\n\n请始终保持角色，用自然的聊天口吻回复。"
  }
};

// 把模板里的 {{变量}} 替换成真实内容
window.fillPrompt=function(tpl,vars){
  return String(tpl||"").replace(/\{\{(\w+)\}\}/g,function(m,k){return vars&&vars[k]!=null?vars[k]:""});
};

// 生成某个角色的系统提示词（之后写聊天功能时直接调用）
window.buildSystemPrompt=function(contactId){
  var u=window.getUserProfile?window.getUserProfile():{};
  var c=null;(window.getContacts?window.getContacts():[]).forEach(function(x){if(x.id===contactId)c=x});
  if(!c)return "";
  return window.fillPrompt(CONFIG.prompts.system,{
    user:u.name||"",userPersona:u.persona||u.bio||"",
    char:c.real||c.user||"",charDesc:c.desc||""
  });
};
</script>
<script src="base.js"></script>
<script src="people.js"></script>
<script src="settings.js"></script>
<script src="chat.js"></script>
<script src="spaces.js"></script>
<script src="library.js"></script>
<script src="system.js"></script>
<script src="chat-extras.js"></script>
<script src="char.js"></script>

</body>
</html>
