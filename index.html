<style>
/* 启动画面：模块还在加载时显示，避免出现空白的壳子 */
#splash{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .25s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:68px;height:68px;border-radius:17px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
#splash div{display:flex;gap:6px}
#splash i{width:6px;height:6px;border-radius:50%;background:#bdbdbd;animation:splb 1.1s infinite}
#splash i:nth-child(2){animation-delay:.18s}#splash i:nth-child(3){animation-delay:.36s}
@keyframes splb{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-color-scheme:dark){#splash{background:#121212}#splash i{background:#777}}
</style>

<script id="config">
/* ============================================================
   CONFIG 配置区：以后改默认值、内置词，只改这一块，不用动下面的界面代码
   ============================================================ */
// 版本号：每次更新文件时改这里（检查更新就是靠对比它）
window.APP_VERSION="1.7.4";

window.CONFIG={
  // 默认个人资料（用户自己改过的会存在浏览器里，优先于这里）
  profile:{name:"Nana",handle:"@_septemberthird",bio:"take me somewhere far away from here.",fans:"19k",avatar:"",persona:"",bg:"",uid:"",real:""},

  // 默认设置（API 地址、Key 等不要写在这里，在 App 的 Settings 里填，避免传到 GitHub）
  settings:{api:{base:"",key:"",model:"",temp:"0.8",max:"1024",ctx:"30"},voice:{key:"",voice:"",model:"eleven_multilingual_v2"},img:{base:"",key:"",model:"",size:"1024x1024",pos:"",neg:""},vision:{base:"",key:"",model:"",frames:"6"},stt:{base:"",key:"",model:"whisper-1",lang:""},theme:"system",lastBackup:0},

  // 内置词（提示词模板）。{{...}} 会在发送前被替换成真实内容
  // 可用变量：{{user}} 用户昵称  {{userPersona}} 用户人设  {{char}} 角色名  {{charDesc}} 角色描述
  // 记忆库的默认类型（可以在添加记忆时再新建别的类型）
  memoryTypes:["重要","日常","约定","喜好"],

  prompts:{
    system:"你是{{char}}，正在和{{user}}聊天。\n\n【你的设定】\n{{charDesc}}\n\n【对方的信息】\n{{userPersona}}\n\n请始终保持角色，用自然的聊天口吻回复。"
  }
};

// 把模板里的 {{变量}} 替换成真实内容
window.fillPrompt=function(tpl,vars){
  return String(tpl||"").replace(/\{\{(\w+)\}\}/g,function(m,k){return vars&&vars[k]!=null?vars[k]:""});
};

// 生成某个角色的系统提示词（之后写聊天功能时直接调用）
window.buildSystemPrompt=function(contactId){
  var u=window.getUserProfile?window.getUserProfile():{};
  var c=null;(window.getContacts?window.getContacts():[]).forEach(function(x){if(x.id===contactId)c=x});
  if(!c)return "";
  return window.fillPrompt((window.PROMPTS&&PROMPTS.system)||CONFIG.prompts.system,{
    user:u.name||"",userPersona:u.persona||u.bio||"",
    char:c.real||c.user||"",charDesc:c.desc||""
  });
};
</script>
<script id="imgstore">
/* ============================================================
   图片仓库：把大图片（头像、背景、动态配图等）从 localStorage（只有约 5MB）挪到 IndexedDB（容量大得多）
   - 保存时：localStorage 里只留一个很短的标记 idb:img:xxxx，真正的图片存进 IndexedDB
   - 读取时：自动把标记换回图片，其他代码完全感觉不到变化
   - 如果 IndexedDB 用不了，就退回原来的存法（图片直接存在 localStorage 里）
   - 这段脚本负责先把图片读进内存，再按顺序加载各个模块
   ============================================================ */
(function(){
  var DBN="unicos_img",ST="i";
  var RE_BIG=/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+\/=]{6000,}/g,
      RE_BIG1=/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+\/=]{6000,}/,
      RE_TOK=/idb:img:[0-9a-f]{16}[0-9a-z]+/g;
  var cache={},db=null,ok=false;
  var SP=Storage.prototype,_get=SP.getItem,_set=SP.setItem;

  function hash(s){
    var a=2166136261,b=5381;
    for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a^=c;a=Math.imul(a,16777619);b=(Math.imul(b,33)^c)|0}
    return("0000000"+(a>>>0).toString(16)).slice(-8)+("0000000"+(b>>>0).toString(16)).slice(-8)+s.length.toString(36);
  }
  function openDB(cb){
    var r=indexedDB.open(DBN,1);
    r.onupgradeneeded=function(){r.result.createObjectStore(ST)};
    r.onsuccess=function(){cb(null,r.result)};
    r.onerror=function(){cb(r.error||new Error("idb"))};
  }
  function put(k,v,cb){
    try{
      var tx=db.transaction(ST,"readwrite");tx.objectStore(ST).put(v,k);
      tx.oncomplete=function(){cb&&cb(null)};
      tx.onerror=tx.onabort=function(){ok=false;cb&&cb(new Error("put"))};
    }catch(e){ok=false;cb&&cb(e)}
  }
  function delK(k){try{var tx=db.transaction(ST,"readwrite");tx.objectStore(ST).delete(k)}catch(e){}}
  function all(cb){
    try{
      var out={},tx=db.transaction(ST,"readonly"),rq=tx.objectStore(ST).openCursor();
      rq.onsuccess=function(){var c=rq.result;if(c){out[c.key]=c.value;c.continue()}else cb(null,out)};
      rq.onerror=function(){cb(rq.error||new Error("cursor"))};
    }catch(e){cb(e)}
  }
  function ext(v){
    if(!ok||typeof v!=="string"||v.indexOf("data:image")<0)return v;
    return v.replace(RE_BIG,function(m){var t="idb:img:"+hash(m);if(!(t in cache)){cache[t]=m;put(t,m)}return t});
  }
  function hyd(v){
    if(typeof v!=="string"||v.indexOf("idb:img:")<0)return v;
    return v.replace(RE_TOK,function(t){return t in cache?cache[t]:t});
  }
  SP.getItem=function(k){var v=_get.call(this,k);return this===window.localStorage?hyd(v):v};
  SP.setItem=function(k,v){return _set.call(this,k,this===window.localStorage?ext(String(v)):v)};

  var ready=new Promise(function(res){
    if(!window.indexedDB){res();return}
    try{openDB(function(e,d){
      if(e){res();return}
      db=d;all(function(e2,m){if(!e2){cache=m||{};ok=true}res()});
    })}catch(e){res()}
  });

  // 把已经存在 localStorage 里的旧图片搬进 IndexedDB（只搬一次，之后保存会自动处理）
  function migrate(){
    if(!ok)return Promise.resolve(0);
    var keys=[],i,n=0;for(i=0;i<localStorage.length;i++)keys.push(localStorage.key(i));
    var chain=Promise.resolve();
    keys.forEach(function(k){
      chain=chain.then(function(){
        var raw=_get.call(localStorage,k);
        if(!raw||raw.indexOf("data:image")<0||!RE_BIG1.test(raw))return;
        var puts=[],val=raw.replace(RE_BIG,function(m){var t="idb:img:"+hash(m);puts.push([t,m]);return t});
        return Promise.all(puts.map(function(p){return new Promise(function(res,rej){put(p[0],p[1],function(e){e?rej(e):res()})})})).then(function(){
          puts.forEach(function(p){cache[p[0]]=p[1]});
          if(_get.call(localStorage,k)===raw){_set.call(localStorage,k,val);n++}
        }).catch(function(){});
      });
    });
    return chain.then(function(){return n});
  }
  // 清理没有被任何数据引用的图片
  function gc(){
    return new Promise(function(res){
      var used={},i,k,raw;
      for(i=0;i<localStorage.length;i++){k=localStorage.key(i);raw=_get.call(localStorage,k)||"";(raw.match(RE_TOK)||[]).forEach(function(t){used[t]=1})}
      var n=0,bytes=0;
      Object.keys(cache).forEach(function(t){if(!used[t]){bytes+=cache[t].length;n++;delete cache[t];delK(t)}});
      res({n:n,bytes:bytes});
    });
  }
  function usage(){
    var ls=0,img=0,i,k,v;
    for(i=0;i<localStorage.length;i++){k=localStorage.key(i);v=_get.call(localStorage,k)||"";ls+=(k.length+v.length)*2}
    Object.keys(cache).forEach(function(t){img+=cache[t].length});
    return{ls:ls,img:img};
  }
  window.IMG={ready:ready,migrate:migrate,gc:gc,usage:usage,isOk:function(){return ok}};

  // 先等图片读进内存，再按顺序加载各个模块（最多等 3 秒，超时也照样启动）
  var mods=["base.js","prompts.js","people.js","settings.js","chat.js","spaces.js","library.js","system.js","chat-extras.js","char.js"],started=false,idbReady=false,got=0,srcs={};
  function hideSplash(){
    var sp=document.getElementById("splash");if(!sp)return;
    requestAnimationFrame(function(){sp.classList.add("hide");setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},400)});
  }
  // 图片读完、全部模块也下载完，才按顺序执行（模块下载和读图片同时进行，不再一个等一个）
  function run(){
    if(started||!idbReady||got<mods.length)return;started=true;
    mods.forEach(function(m){
      var s=document.createElement("script");
      if(srcs[m]!=null)s.textContent=srcs[m]+"\n//# sourceURL="+m;else s.src=m;
      document.body.appendChild(s);
    });
    hideSplash();setTimeout(function(){migrate()},2500);
  }
  // 一开始就同时下载全部模块
  mods.forEach(function(m){
    fetch(m).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){srcs[m]=t},function(){srcs[m]=null}).then(function(){got++;run()});
  });
  // 图片还没读进内存就启动的话头像会是空的，所以最多等 8 秒（IndexedDB 用不了时会立刻继续）
  ready.then(function(){idbReady=true;run()},function(){idbReady=true;run()});
  setTimeout(function(){idbReady=true;run()},8000);setTimeout(hideSplash,12000);
})();
</script>
