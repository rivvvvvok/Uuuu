<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>unicos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="unicos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#fff; --fill:#f5f5f5; --text:#2b2b2b; --sub:#a3a3a3; --btn:#f0f0f0; --av:#d9d9d9; --hair:rgba(128,128,128,.18);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121212;--fill:#1e1e1e;--text:#f0f0f0;--sub:#7d7d7d;--btn:#242424;--av:#3a3a3a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121212;--fill:#1e1e1e;--text:#f0f0f0;--sub:#7d7d7d;--btn:#242424;--av:#3a3a3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--text);font-weight:500;overflow:hidden}
.app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative}
.main{flex:1;overflow-y:auto;padding:30px 26px calc(100px + env(safe-area-inset-bottom,0px))}
.main[hidden],nav[hidden],.search[hidden]{display:none}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

.top,.ctop{display:flex;justify-content:space-between;align-items:center}
.circle{width:34px;height:34px;border-radius:50%;background:var(--btn);display:grid;place-items:center}
.circle svg{width:17px;height:17px}
.cbtns{display:flex;gap:10px}
.ctop h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}

.me{display:flex;align-items:center;gap:13px;margin-top:20px;cursor:pointer}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--av);overflow:hidden;flex:none;display:grid;place-items:center;color:#fff;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:28px;height:28px;stroke:#fff}
.meinfo{flex:1;min-width:0}
.name{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icons{display:flex;gap:14px;color:var(--sub)}
.icons svg{width:20px;height:20px}

.search{margin-top:18px;height:38px;border-radius:19px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--sub)}
.search svg{width:15px;height:15px}
.search input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:13px;color:var(--text);min-width:0}
.search input::placeholder{color:var(--sub);font-weight:700}

.tabs{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:18px}
.tab{font-size:14px;font-weight:800;color:var(--sub)}
.tab.on{color:var(--text)}
.tabs svg{width:16px;height:16px;color:var(--sub)}

.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px;color:var(--sub);font-size:11px;font-weight:800;letter-spacing:.5px}
.sec svg{width:14px;height:14px;transition:transform .2s}
.sec.closed svg{transform:rotate(-90deg)}
.item{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:20px;padding:8px 14px 8px 8px;width:100%;text-align:left}
.item+.item{margin-top:8px}
.item .avatar svg{width:24px;height:24px}
.item .body{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .t{font-size:14px;font-weight:700}
.item .d{font-size:11px;color:var(--sub);font-weight:700;flex:none}
.item .p{font-size:12px;color:var(--sub);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);font-size:13px;margin-top:80px;line-height:1.7;font-weight:600}

/* Contacts */
.addpill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:22px;background:var(--fill);font-size:14px;font-weight:700;margin:16px 0 14px}
.addpill svg{width:18px;height:18px}

/* Add / Edit contact */
.cancel{font-size:15px;font-weight:700}
.card{background:var(--fill);border-radius:22px;padding:14px 16px;margin-top:10px}
.card label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}
.card input,.card textarea{width:100%;border:0;outline:none;background:none;color:var(--text);font:inherit;font-size:15px;padding:0;resize:none;display:block}
.card textarea{height:64px}
.card textarea.tall{height:130px}
.card ::placeholder{color:var(--sub);opacity:1}
.fl+.fl{border-top:1px solid var(--hair);margin-top:12px;padding-top:12px}
.lrow{display:flex;align-items:center;gap:14px;cursor:pointer}
.lrow .tx{flex:1;min-width:0}
.lrow b{display:block;font-size:14px;font-weight:800}
.lrow small{display:block;font-size:12px;color:var(--sub);margin-top:3px;font-weight:600}
.lrow>svg{width:16px;height:16px;color:var(--sub);flex:none}
.avc{width:64px;height:64px;border-radius:50%;background:var(--av);display:grid;place-items:center;position:relative;flex:none}
.avc>img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avc>svg.p{width:34px;height:34px;stroke:#fff;stroke-width:1.5}
.cam2{position:absolute;right:-3px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--text)}
.cam2 svg{width:13px;height:13px}
.bgth{width:40px;height:40px;border-radius:12px;background:var(--av);overflow:hidden;flex:none}
.bgth img{width:100%;height:100%;object-fit:cover;display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:9;white-space:nowrap}

/* ME 页 */
.bigav{width:100%;aspect-ratio:1;border-radius:26px;background:var(--av);overflow:hidden;display:grid;place-items:center;position:relative}
.bigav img{width:100%;height:100%;object-fit:cover}
.bigav svg.p{width:34%;height:34%;stroke:#fff;stroke-width:1.4}
.cam{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.cam svg{width:17px;height:17px}
.mname{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:28px;font-weight:600;line-height:1.1}
.badge{width:20px;height:20px;flex:none;color:var(--sub);fill:currentColor;stroke:none}
.badge path.ck{fill:none;stroke:var(--bg);stroke-width:2.2}
.mhandle{font-size:15px;color:var(--sub);margin-top:6px}
.mbio{font-size:15px;color:var(--sub);margin-top:16px;line-height:1.5;white-space:pre-wrap}
.mfans{font-size:13px;color:var(--sub);margin-top:16px}
.mpersona{background:var(--fill);border-radius:16px;padding:12px 16px;margin-top:16px;font-size:13px;line-height:1.6;color:var(--sub)}
.mpersona b{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px}
.mpersona .cl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.bigbtn{display:block;width:100%;height:46px;border-radius:23px;background:var(--text);color:var(--bg);font-size:15px;font-weight:600;margin-top:22px}
.ghost{display:block;width:100%;height:40px;color:var(--sub);font-size:14px;font-weight:600;margin-top:6px}
.field{margin-top:14px}
.field label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px 4px}
.field input,.field textarea{width:100%;border:0;outline:none;background:var(--fill);color:var(--text);font:inherit;font-size:15px;border-radius:16px;padding:12px 16px;resize:none}
.field textarea{height:72px}
.field textarea.tall{height:150px}
.efirst{margin-top:20px}

nav{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;margin:0 26px calc(12px + env(safe-area-inset-bottom,0px));padding:4px;border-radius:999px;background:var(--fill);box-shadow:0 6px 22px rgba(0,0,0,.12)}
.app::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 30%,transparent);pointer-events:none;z-index:4}
.app:has(#nav[hidden]):has(#cnav[hidden])::after{display:none}
nav button{flex:1;padding:8px 0 12px;line-height:1;border-radius:999px;color:var(--sub);transition:background .2s,color .2s}
nav button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
nav span{font-size:10px;font-weight:700;letter-spacing:1.2px}

/* Chats 重做 */
:root{--ov:rgba(255,255,255,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ov:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--ov:rgba(0,0,0,.4)}
.banner{border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--fill),var(--av));background-size:cover;background-position:center}
.banner.img::before{content:"";position:absolute;inset:0;background:var(--ov)}
.bnTop{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 16px;min-height:112px}
.bnMe{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer}
.bnAv{position:relative;flex:none}
.bnAv .avatar{width:60px;height:60px;border:2.5px solid var(--ring)}
.dot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#8db596;border:2.5px solid var(--ring)}
.status{font-size:13px;color:var(--sub);font-weight:600;margin-top:3px}
.banner .circle{background:var(--bg);opacity:.92}
.big{margin:20px 0 0 2px;font-size:26px;font-weight:800;letter-spacing:-.3px}
.seg{display:flex;margin-top:14px;padding:4px;border-radius:999px;background:var(--fill)}
.seg button{flex:1;padding:8px 0;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);line-height:1.2;transition:background .2s,color .2s}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
#qBar{margin-top:10px}
#list{margin-top:12px}
.item{padding:10px 14px 10px 10px;border-radius:22px}
.item .avatar{width:40px;height:40px}
.item .avatar svg{width:22px;height:22px}
.row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px}
.row2 .p{margin-top:0;flex:1;min-width:0}
.bd{min-width:18px;height:18px;border-radius:9px;background:var(--sub);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;flex:none}

/* Moments */
.cover{border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--fill),var(--av));background-size:cover;background-position:center}
.cover.img::before{content:"";position:absolute;inset:0;background:var(--ov)}
.cvIn{position:relative;padding:30px 16px 24px;display:flex;flex-direction:column;align-items:center}
.cvIn .avatar{width:72px;height:72px;border:3px solid var(--ring)}
.cvIn .avatar svg{width:40px;height:40px}
.cvName{font-size:20px;font-weight:800;margin-top:12px}
.postBtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 28px;border-radius:19px;background:var(--bg);font-size:14px;font-weight:700;margin-top:14px}
.postBtn svg{width:16px;height:16px}
.post{padding:16px 0;border-bottom:1px solid var(--hair)}
.post:last-child{border-bottom:0}
.ph{display:flex;align-items:center;gap:10px}
.ph .avatar{width:38px;height:38px}
.ph .avatar svg{width:22px;height:22px}
.pn{font-size:14px;font-weight:700}
.pt{font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
.pmore{margin-left:auto;color:var(--sub);padding:4px;font-size:12px;font-weight:700}
.pmore svg{width:18px;height:18px}
.pmore.arm{color:#e5484d}
.ptx{font-size:14px;font-weight:600;line-height:1.55;margin-top:10px;white-space:pre-wrap}
.pimgs{display:grid;gap:4px;margin-top:10px;border-radius:16px;overflow:hidden}
.pimgs.n1{grid-template-columns:1fr}
.pimgs.n2{grid-template-columns:1fr 1fr}
.pimgs.n3{grid-template-columns:repeat(3,1fr)}
.pimgs.q{grid-template-columns:1fr 1fr}
.pimgs img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pimgs.n1 img{aspect-ratio:16/10}
.pmeta{font-size:12px;color:var(--sub);font-weight:600;margin-top:8px}
.pact{display:flex;gap:22px;margin-top:12px}
.pact button{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub)}
.pact svg{width:21px;height:21px}
.pact .liked{color:var(--text)}
.pact .liked svg{fill:currentColor}
.cmts{margin-top:10px;background:var(--fill);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:600;line-height:1.55}
.cmts b{font-weight:800}
.cin{display:flex;gap:8px;margin-top:8px}
.cin input{flex:1;min-width:0;border:0;outline:none;background:var(--fill);color:var(--text);font:inherit;font-size:13px;border-radius:999px;padding:9px 14px}
.cin button{padding:0 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;font-weight:700}
#sheetWrap{position:absolute;inset:0;z-index:20}
#sheetWrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--av);margin:0 auto 14px}
.sh{display:flex;align-items:center;justify-content:space-between}
.sh .cn{font-size:15px;font-weight:700;min-width:56px;text-align:left}
.sh .ttl{font-size:15px;font-weight:800}
.sh .go{height:34px;padding:0 20px;border-radius:17px;background:var(--text);color:var(--bg);font-size:14px;font-weight:700;min-width:56px}
.sh .go:disabled{opacity:.3}
#pText{display:block;width:100%;height:110px;border:0;outline:none;background:none;color:var(--text);font:inherit;font-size:16px;font-weight:600;resize:none;margin:16px 0 8px;padding:0}
#pText::placeholder{color:var(--sub)}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.th{position:relative;width:64px;height:64px;flex:none;border-radius:14px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:10px;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:20px;padding:12px 14px;text-align:left;min-height:52px}
.tile.wide{grid-column:1/-1;justify-content:center}
.tile.wide .tx{flex:none}
.tile svg{width:20px;height:20px;flex:none}
.tile .tx{flex:1;min-width:0}
.tile b{display:block;font-size:13px;font-weight:700}
.tile small{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cnt{font-size:12px;color:var(--sub);font-weight:700}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 2px;text-align:left}
.prow .avatar{width:38px;height:38px}
.prow .avatar svg{width:22px;height:22px}
.chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--av);flex:none;position:relative}
.chk.on{background:var(--text);border-color:var(--text)}
.chk.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}

/* Settings */
.sTitle{display:flex;align-items:center;gap:12px}
.sTitle h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.sgrp{font-size:12px;font-weight:800;color:var(--sub);margin:24px 4px 0}
.show{float:right;font-size:12px;font-weight:700;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);font-weight:600;margin:8px 6px 0;line-height:1.6;word-break:break-all}
.pillbtn{display:block;width:100%;height:42px;border-radius:21px;background:var(--fill);font-size:14px;font-weight:700;margin-top:10px}
.pillbtn:disabled{opacity:.5}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
.srow b{font-size:14px;font-weight:800}
.srow span.v{font-size:13px;color:var(--sub);font-weight:700}
.sw{width:44px;height:26px;border-radius:13px;background:var(--av);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:transform .2s}
.sw.on{background:var(--text)}
.sw.on::after{transform:translateX(18px)}
.card textarea.ta{height:84px}
.pills{display:flex;flex-direction:column;gap:10px;margin:16px 0 14px}
.pills .addpill{margin:0;width:100%;height:46px;border-radius:23px}

/* Couple Space */
.cpIn{position:relative;padding:28px 16px 26px}
.cpav{margin-top:0!important}
.cpl{display:flex;align-items:center;gap:12px}
.cpl h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.cpav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px}
.cpav .avatar{width:72px;height:72px;border:3px solid var(--ring)}
.cpav .avatar svg{width:38px;height:38px}
.cpav>svg{width:18px;height:18px;fill:var(--text);stroke:none}
.cpTog{text-align:center;font-size:13px;color:var(--sub);font-weight:700;margin-top:16px}
.cpNum{text-align:center;margin-top:2px}
.cpNum b{font-size:56px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.cpNum span{font-size:14px;color:var(--sub);font-weight:700;margin-left:6px}
.cc{background:var(--fill);border-radius:24px;padding:16px;margin-top:14px}
.cch{display:flex;align-items:center;gap:12px}
.cic{width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.cic svg{width:20px;height:20px}
.cch .tx{flex:1;min-width:0}
.cch b{display:block;font-size:16px;font-weight:800}
.cch small{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.4}
.circle.sm{width:28px;height:28px;background:var(--bg);flex:none}
.circle.sm svg{width:14px;height:14px}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:22px;background:var(--bg);font-size:14px;font-weight:700;margin-top:14px}
.wbtn svg{width:17px;height:17px}
.drow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;text-align:left}
.drow+.drow{border-top:1px solid var(--hair)}
.drow .cic{border-radius:50%;width:38px;height:38px}
.drow .tx{flex:1;min-width:0}
.drow b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow small{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
.drow .in{font-size:13px;font-weight:800;flex:none}
.drow .in.arm{color:#e5484d}
.cpseg button{padding:8px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmon{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.cmon b{font-size:16px;font-weight:800}

<script id="config">
/* ============================================================
   CONFIG 配置区：以后改默认值、内置词，只改这一块，不用动下面的界面代码
   ============================================================ */
window.CONFIG={
  // 默认个人资料（用户自己改过的会存在浏览器里，优先于这里）
  profile:{name:"Nana",handle:"@_septemberthird",bio:"take me somewhere far away from here.",fans:"19k",avatar:"",persona:"",bg:"",uid:"",real:""},

  // 默认设置（API 地址、Key 等不要写在这里，在 App 的 Settings 里填，避免传到 GitHub）
  settings:{api:{base:"",key:"",model:"",temp:"0.8",max:"1024",ctx:"30"},voice:{key:"",voice:"",model:"eleven_multilingual_v2"},img:{base:"",key:"",model:"",size:"1024x1024",pos:"",neg:""},vision:{base:"",key:"",model:"",frames:"6"},stt:{base:"",key:"",model:"whisper-1",lang:""},theme:"system",lastBackup:0},

  // 内置词（提示词模板）。{{...}} 会在发送前被替换成真实内容
  // 可用变量：{{user}} 用户昵称  {{userPersona}} 用户人设  {{char}} 角色名  {{charDesc}} 角色描述
  // 记忆库的默认类型（可以在添加记忆时再新建别的类型）
  memoryTypes:["重要","日常","约定","喜好"],

  prompts:{
    system:"你是{{char}}，正在和{{user}}聊天。\n\n【你的设定】\n{{charDesc}}\n\n【对方的信息】\n{{userPersona}}\n\n请始终保持角色，用自然的聊天口吻回复。"
  }
};

// 把模板里的 {{变量}} 替换成真实内容
window.fillPrompt=function(tpl,vars){
  return String(tpl||"").replace(/\{\{(\w+)\}\}/g,function(m,k){return vars&&vars[k]!=null?vars[k]:""});
};

// 生成某个角色的系统提示词（之后写聊天功能时直接调用）
window.buildSystemPrompt=function(contactId){
  var u=window.getUserProfile?window.getUserProfile():{};
  var c=null;(window.getContacts?window.getContacts():[]).forEach(function(x){if(x.id===contactId)c=x});
  if(!c)return "";
  return window.fillPrompt(CONFIG.prompts.system,{
    user:u.name||"",userPersona:u.persona||u.bio||"",
    char:c.real||c.user||"",charDesc:c.desc||""
  });
};
</script>
<script>
var $=function(s){return document.querySelector(s)};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m,ms){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},ms||2200)}
function shrink(file,max,square,cb){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var c=document.createElement("canvas"),x=c.getContext("2d");
    if(square){var s=Math.min(im.width,im.height);c.width=c.height=max;x.fillStyle="#fff";x.fillRect(0,0,max,max);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max)}
    else{var k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height)}
    cb(c.toDataURL("image/jpeg",.8));
  };im.src=r.result};r.readAsDataURL(file);
}

// ---------- User 个人资料 ----------
var P=JSON.parse(JSON.stringify(CONFIG.profile));
try{
  var raw=store("profile");
  if(raw){Object.assign(P,JSON.parse(raw))}
  else{if(store("myName"))P.name=store("myName");if(store("myHandle"))P.handle=store("myHandle");if(store("avatar"))P.avatar=store("avatar")}
}catch(e){}
function saveP(){store("profile",JSON.stringify(P))}
// 之后聊天提示词会通过这两个函数读取 User 和角色信息
window.getUserProfile=function(){return{name:P.name,real:P.real,uid:P.uid,bio:P.bio,persona:P.persona}};
window.getContacts=function(){return contacts};
var PERSON='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
var PERSONP='<svg class="p" viewBox="0 0 24 24">'+PERSON.replace(/<svg[^>]*>|<\/svg>/g,"")+'</svg>';
function applyHeader(){
  $("#hdName").textContent=P.name;
  $("#hdAvatar").innerHTML=P.avatar?'<img src="'+P.avatar+'">':PERSON;
  var b=$("#banner");
  if(P.bg){b.style.backgroundImage='url("'+P.bg+'")';b.classList.add("img")}else{b.style.backgroundImage="";b.classList.remove("img")}
}

// ---------- 联系人数据 ----------
var contacts=[];try{contacts=JSON.parse(store("contacts")||"[]")}catch(e){}
function saveContacts(){try{localStorage.setItem("contacts",JSON.stringify(contacts));return true}catch(e){toast("存储空间不足，图片可能太大");return false}}
function cname(c){return c.real||c.user}
function idTaken(uid,exceptContact){var l=uid.toLowerCase();if(exceptContact!=="__me"&&P.uid&&P.uid.toLowerCase()===l)return true;return contacts.some(function(c){return c.id!==exceptContact&&c.uid&&c.uid.toLowerCase()===l})}
function nick(c){return c.user||c.real}
function chatsFrom(){return contacts.map(function(c){var d=new Date(c.t);return{id:c.id,name:nick(c),last:c.sig||"New friend",date:(d.getMonth()+1)+"/"+d.getDate(),avatar:c.avatar}})}

// ---------- Chats 列表 ----------
var tab="chats";
function fmtTime(t){
  var d=new Date(t),n=new Date(),day=function(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate())};
  var k=Math.round((day(n)-day(d))/864e5);
  if(k<=0){var h=d.getHours(),m=d.getMinutes();return(h%12||12)+":"+(m<10?"0":"")+m+" "+(h<12?"AM":"PM")}
  if(k===1)return"Yesterday";
  if(k<7)return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
  return(d.getMonth()+1)+"/"+d.getDate();
}
function chatsFrom(){
  var a=contacts.map(function(c){var l=(chats[c.id]||[]).slice(-1)[0];return{id:c.id,name:nick(c),last:l?l.text:(c.sig||"New friend"),t:l?l.t:c.t,date:fmtTime(l?l.t:c.t),unread:0,avatar:c.avatar}});
  var b=groups.map(function(g){var ns=g.members.map(function(m){var c=cget(m);return c?nick(c):null}).filter(Boolean);return{id:g.id,group:true,name:g.name,last:ns.join(", ")||"No members",t:g.t,date:fmtTime(g.t),unread:0,avatar:g.avatar}});
  return a.concat(b).sort(function(x,y){return y.t-x.t});
}
function renderList(){
  var q=$("#q").value.trim().toLowerCase(),el=$("#list");
  var rows=chatsFrom().filter(function(c){return(tab==="chats"||(tab==="groups")===!!c.group)&&(!q||c.name.toLowerCase().indexOf(q)>-1||c.last.toLowerCase().indexOf(q)>-1)});
  el.innerHTML=rows.length?rows.map(function(c){
    var right=tab!=="friends"?'<span class="d">'+c.date+'</span>':'';
    var badge=tab==="chats"&&c.unread?'<span class="bd">'+(c.unread>99?"99+":c.unread)+'</span>':'';
    return '<button class="item" data-id="'+c.id+'"'+(c.group?' data-g="1"':'')+'><div class="avatar">'+(c.avatar?'<img src="'+c.avatar+'">':(c.group?GROUPI:PERSON))+'</div>'+
      '<div class="body"><div class="row"><span class="t">'+esc(c.name)+'</span>'+right+'</div><div class="row2"><div class="p">'+esc(c.last)+'</div>'+badge+'</div></div></button>';
  }).join(""):'<div class="empty" style="margin-top:50px">'+(q?"没有找到":tab==="groups"?"还没有群聊<br>去 CONTACTS 点 New Group 创建":tab==="friends"?"还没有好友<br>去 CONTACTS 添加":"还没有聊天<br>去 CONTACTS 添加一个角色")+'</div>';
}
$("#tabs").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(function(t){t.classList.toggle("on",t===b)});renderList();
};
$("#q").oninput=renderList;
$("#qBtn").onclick=function(){var b=$("#qBar");b.hidden=!b.hidden;if(!b.hidden)$("#q").focus();else{$("#q").value="";renderList()}};

// ---------- Contacts 页 ----------
function renderContacts(){
  var q=$("#cq").value.trim().toLowerCase();
  var rows=contacts.slice().sort(function(a,b){return cname(a).localeCompare(cname(b))}).filter(function(c){return !q||((c.real||"")+(c.user||"")).toLowerCase().indexOf(q)>-1});
  var gs=groups.filter(function(g){return !q||g.name.toLowerCase().indexOf(q)>-1});
  var h=rows.map(function(c){
    var sub=c.sig||(c.user?"@"+c.user.replace(/^@/,""):"");
    return '<button class="item" data-id="'+c.id+'"><div class="avatar">'+(c.avatar?'<img src="'+c.avatar+'">':PERSON)+'</div><div class="body"><div class="t">'+esc(cname(c))+'</div>'+(sub?'<div class="p">'+esc(sub)+'</div>':'')+'</div></button>';
  }).join("");
  if(gs.length)h+='<div class="sec" style="margin-top:18px"><span>Groups</span></div>'+gs.map(function(g){
    var n=g.members.filter(function(m){return cget(m)}).length;
    return '<button class="item" data-gid="'+g.id+'"><div class="avatar">'+(g.avatar?'<img src="'+g.avatar+'">':GROUPI)+'</div><div class="body"><div class="t">'+esc(g.name)+'</div><div class="p">'+n+' members</div></div></button>';
  }).join("");
  $("#cList").innerHTML=h||'<div class="empty" style="margin-top:60px">'+(q?"没有找到":"还没有联系人<br>点上面的 Add Friend 添加角色")+'</div>';
}
$("#cList").onclick=function(e){var b=e.target.closest(".item");if(!b)return;if(b.dataset.gid)openGroupForm(b.dataset.gid);else openProfile(b.dataset.id)};
$("#cq").oninput=renderContacts;
$("#cSearch").onclick=function(){var b=$("#cSearchBar");b.hidden=!b.hidden;if(!b.hidden)$("#cq").focus();else{$("#cq").value="";renderContacts()}};
$("#addBtn").onclick=function(){openForm()};


// ---------- 添加 / 编辑角色 ----------
var F={};
var CAM='<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/></svg>';
var CHEV='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
function showAv(){$("#avc").innerHTML=(F.avatar?'<img src="'+F.avatar+'">':PERSONP)+'<span class="cam2">'+CAM+'</span>'}
function showBg(){$("#bgth").innerHTML=F.bg?'<img src="'+F.bg+'">':''}
function openForm(id){
  var c=null;if(id)contacts.forEach(function(x){if(x.id===id)c=x});
  F={id:c?c.id:null,t:c?c.t:Date.now(),avatar:c?c.avatar:"",bg:c?c.bg:""};
  $("#pgAdd").innerHTML=
    '<button class="cancel" id="fCancel">Cancel</button>'+
    '<div class="card lrow" id="avRow"><div class="avc" id="avc"></div><div class="tx"><b>Avatar</b><small>上传或选择头像</small></div>'+CHEV+'</div>'+
    '<div class="card lrow" id="bgRow"><div class="tx"><b>Background</b><small>设置聊天背景图片</small></div><div class="bgth" id="bgth"></div>'+CHEV+'</div>'+
    '<div class="card"><div class="fl"><label>Username</label><input id="cUser" maxlength="30" placeholder="输入用户名" value="'+esc(c&&c.user)+'"></div>'+
    '<div class="fl"><label>Real Name</label><input id="cReal" maxlength="30" placeholder="输入真名" value="'+esc(c&&c.real)+'"></div><div class="fl"><label>ID</label><input id="cUid" maxlength="30" placeholder="唯一 ID，例如 moon.river_27" value="'+esc(c&&c.uid)+'"></div></div>'+
    '<div class="card"><label>Signature</label><textarea id="cSig" maxlength="80" placeholder="写一句简短的签名…">'+esc(c&&c.sig)+'</textarea></div>'+
    '<div class="card"><label>Character Description</label><textarea class="tall" id="cDesc" maxlength="4000" placeholder="写下这个角色的性格、背景、说话方式…（AI 会读取）">'+esc(c&&c.desc)+'</textarea></div>'+
    '<input type="file" accept="image/*" hidden id="fAv"><input type="file" accept="image/*" hidden id="fBg">'+
    '<button class="bigbtn" id="cSave">'+(c?"Save":"Add Contact")+'</button>'+(c?'<button class="ghost" id="cDel">Delete Contact</button>':'');
  showAv();showBg();
  $("#fCancel").onclick=function(){if(F.id)openProfile(F.id);else go("contacts")};
  $("#avRow").onclick=function(){$("#fAv").click()};
  $("#bgRow").onclick=function(){$("#fBg").click()};
  $("#fAv").onchange=function(){if(this.files[0])shrink(this.files[0],400,true,function(d){F.avatar=d;showAv()})};
  $("#fBg").onchange=function(){if(this.files[0])shrink(this.files[0],900,false,function(d){F.bg=d;showBg()})};
  $("#cSave").onclick=function(){
    var u=$("#cUser").value.trim(),r=$("#cReal").value.trim();
    if(!u&&!r){$("#cUser").focus();toast("请至少填写 Username 或 Real Name");return}
    var uid=$("#cUid").value.trim();
    if(uid&&idTaken(uid,F.id||"")){toast("这个 ID 已经被用了");return}
    var o={id:F.id||Date.now().toString(36),user:u,real:r,uid:uid,sig:$("#cSig").value.trim(),desc:$("#cDesc").value.trim(),avatar:F.avatar,bg:F.bg,t:F.t};
    var old=contacts.slice(),isNew=!F.id,hit=false;
    contacts=contacts.map(function(x){if(x.id===o.id){hit=true;return o}return x});
    if(!hit)contacts.push(o);
    if(!saveContacts()){contacts=old;return}
    toast(isNew?"已添加":"已保存");openProfile(o.id);
  };
  var dl=$("#cDel");
  if(dl)dl.onclick=function(){
    if(!dl.dataset.arm){dl.dataset.arm="1";dl.textContent="再点一次确认删除";dl.style.color="#e5484d";return}
    contacts=contacts.filter(function(x){return x.id!==F.id});saveContacts();toast("已删除");go("contacts");
  };
  go("add");
}

function ago(t){var s=(Date.now()-t)/1000;if(s<60)return"now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";if(s<604800)return Math.floor(s/86400)+"d ago";var d=new Date(t);return(d.getMonth()+1)+"/"+d.getDate()}
function who(id){if(id==="me")return{name:P.name,avatar:P.avatar};var r={name:"Unknown",avatar:""};contacts.forEach(function(c){if(c.id===id)r={name:nick(c),avatar:c.avatar}});return r}
function avh(a){return a?'<img src="'+a+'">':PERSON}
function names(ids){return ids.map(function(i){return who(i).name}).join(", ")}

function postHTML(p){
  var a=who(p.by),liked=p.likes.indexOf("me")>-1,meta=[];
  if(p.loc)meta.push(esc(p.loc));
  if(p.mention&&p.mention.length)meta.push("@"+esc(names(p.mention).replace(/, /g," @")));
  if(p.vis==="Only me")meta.push("Only me");
  var n=p.imgs?p.imgs.length:0;
  return '<div class="post"><div class="ph"><div class="avatar">'+avh(a.avatar)+'</div><div><div class="pn">'+esc(a.name)+'</div><div class="pt">'+ago(p.t)+'</div></div>'+
    (p.by==="me"?'<button class="pmore'+(armId===p.id?' arm':'')+'" data-act="del" data-id="'+p.id+'">'+(armId===p.id?'Delete':I.dots)+'</button>':'')+'</div>'+
    (p.text?'<div class="ptx">'+esc(p.text)+'</div>':'')+
    (n?'<div class="pimgs n'+Math.min(n,3)+(n===4?' q':'')+'">'+p.imgs.map(function(s){return '<img src="'+s+'">'}).join("")+'</div>':'')+
    (meta.length?'<div class="pmeta">'+meta.join(" · ")+'</div>':'')+
    '<div class="pact"><button class="'+(liked?'liked':'')+'" data-act="like" data-id="'+p.id+'">'+I.heart+(p.likes.length||"")+'</button>'+
    '<button data-act="cmt" data-id="'+p.id+'">'+I.cmt+(p.cmts.length||"")+'</button></div>'+
    (p.cmts.length?'<div class="cmts">'+p.cmts.map(function(c){return '<div><b>'+esc(who(c.by).name)+'</b> '+esc(c.text)+'</div>'}).join("")+'</div>':'')+
    (cmtId===p.id?'<div class="cin"><input id="cIn" placeholder="写评论…" maxlength="200"><button data-act="send" data-id="'+p.id+'">Send</button></div>':'')+
    '</div>';
}
function renderMoments(){
  var list=posts.filter(function(p){return momTab==="posts"||p.likes.indexOf("me")>-1});
  var handle=P.uid?"@"+P.uid.replace(/^@/,""):"";
  $("#pgMoments").innerHTML=
    heroCard({bg:P.bg,av:avh(P.avatar),st:stHTML("me",true),name:esc(P.name),handle:handle,sig:P.bio,btn:'data-act="new"',label:"Post"})+
    '<div class="seg" style="margin-top:22px"><button data-act="tab" data-v="posts" class="'+(momTab==="posts"?"on":"")+'">Posts</button><button data-act="tab" data-v="likes" class="'+(momTab==="likes"?"on":"")+'">Likes</button></div>'+
    '<div style="margin-top:6px">'+(list.length?list.map(postHTML).join(""):'<div class="empty" style="margin-top:40px">'+(momTab==="posts"?"还没有动态<br>点 Post 发第一条":"还没有点赞")+'</div>')+'</div>';
  var ci=$("#pgMoments #cIn");if(ci)ci.focus();
}
$("#pgMoments").onclick=function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,id=b.dataset.id,p=null;posts.forEach(function(x){if(x.id===id)p=x});
  if(act!=="del")armId=null;
  if(act==="new"){openCompose();return}
  if(act==="stedit"){openStatus(false);return}
  if(act==="tab")momTab=b.dataset.v;
  else if(act==="like"&&p){var i=p.likes.indexOf("me");if(i>-1)p.likes.splice(i,1);else p.likes.push("me");savePosts()}
  else if(act==="cmt")cmtId=cmtId===id?null:id;
  else if(act==="send"&&p){var v=$("#cIn").value.trim();if(!v)return;p.cmts.push({by:"me",text:v,t:Date.now()});savePosts();cmtId=null}
  else if(act==="del"){if(armId===id){posts=posts.filter(function(x){return x.id!==id});savePosts();armId=null}else armId=id}
  renderMoments();
};
$("#pgMoments").onkeydown=function(e){if(e.key==="Enter"&&e.target.id==="cIn"){var b=$("#pgMoments [data-act=send]");if(b)b.click()}};

function tile(id,ico,name,sub,cnt,wide){return '<button class="tile'+(wide?' wide':'')+'" data-tl="'+id+'">'+ico+'<span class="tx"><b>'+name+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>'+(cnt?'<span class="cnt">'+cnt+'</span>':'')+'</button>'}
function openCompose(){D={text:"",imgs:[],loc:"",locOpen:false,mention:[],hide:[],vis:"Friends"};composeView();$("#sheetWrap").hidden=false;setTimeout(function(){var t=$("#pText");if(t)t.focus()},60)}
function closeSheet(){$("#sheetWrap").hidden=true;$("#sheet").innerHTML=""}
function canPost(){return !!(D.text.trim()||D.imgs.length)}
function composeView(){
  $("#sheet").innerHTML='<div class="grab"></div><div class="sh"><button class="cn" id="shCancel">Cancel</button><span class="ttl">New Post</span><button class="go" id="shPost"'+(canPost()?'':' disabled')+'>Post</button></div>'+
   '<textarea id="pText" placeholder="Share something…">'+esc(D.text)+'</textarea>'+
   (D.imgs.length?'<div class="thumbs">'+D.imgs.map(function(s,i){return '<div class="th"><img src="'+s+'"><button class="x" data-rm="'+i+'">✕</button></div>'}).join("")+'</div>':'')+
   (D.locOpen?'<div class="card" style="margin:0 0 8px"><input id="pLoc" placeholder="输入地点" maxlength="40" value="'+esc(D.loc)+'"></div>':'')+
   '<div class="tiles">'+tile("photos",I.photo,"Photos","",D.imgs.length+"/9")+tile("loc",I.loc,"Location",D.loc)+
   tile("mention",I.at,"Mention",names(D.mention))+tile("vis",I.eye,"Visibility",D.vis)+tile("hide",I.hide,"Hide From",names(D.hide),"",true)+'</div>'+stCapHTML();
  $("#pText").oninput=function(){D.text=this.value;$("#shPost").disabled=!canPost()};
  var pl=$("#pLoc");if(pl){pl.oninput=function(){D.loc=this.value};if(!D.loc)pl.focus()}
}
function pickerView(kind){
  D.pk=kind;
  $("#sheet").innerHTML='<div class="grab"></div><div class="sh"><span style="min-width:56px"></span><span class="ttl">'+(kind==="mention"?"Mention":"Hide From")+'</span><button class="go" id="pkDone">Done</button></div><div style="margin-top:12px">'+
   contacts.map(function(c){return '<button class="prow" data-pk="'+c.id+'"><div class="avatar">'+avh(c.avatar)+'</div><span class="pn">'+esc(nick(c))+'</span><i class="chk'+(D[kind].indexOf(c.id)>-1?' on':'')+'"></i></button>'}).join("")+'</div>';
}
$("#scrim").onclick=closeSheet;
$("#sheet").onclick=function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.id==="shCancel")return closeSheet();
  if(t.id==="pkDone")return composeView();
  if(t.dataset.pk){var arr=D[D.pk],i=arr.indexOf(t.dataset.pk);if(i>-1)arr.splice(i,1);else arr.push(t.dataset.pk);t.querySelector(".chk").classList.toggle("on");return}
  if(t.dataset.rm){D.imgs.splice(+t.dataset.rm,1);return composeView()}
  if(t.id==="shPost"){
    if(!canPost())return;
    var o={id:Date.now().toString(36),by:"me",text:D.text.trim(),imgs:D.imgs,loc:D.loc.trim(),mention:D.mention,hide:D.hide,vis:D.vis,t:Date.now(),likes:[],cmts:[]};
    posts.unshift(o);if(!savePosts()){posts.shift();return}
    closeSheet();momTab="posts";renderMoments();toast("已发布");return;
  }
  var tl=t.dataset.tl;if(!tl)return;
  if(tl==="photos"){
    if(D.imgs.length>=9){toast("最多 9 张");return}
    var inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.multiple=true;
    inp.onchange=function(){
      var fs=[].slice.call(inp.files).slice(0,9-D.imgs.length),left=fs.length;if(!left)return;
      fs.forEach(function(f){shrink(f,800,false,function(d){D.imgs.push(d);if(--left===0)composeView()})});
    };inp.click();
  }
  else if(tl==="loc"){D.locOpen=!D.locOpen;composeView()}
  else if(tl==="vis"){D.vis=D.vis==="Friends"?"Only me":"Friends";composeView()}
  else if(tl==="mention"||tl==="hide"){if(!contacts.length){toast("还没有联系人");return}pickerView(tl)}
};

    (opt.secret?'type="password" autocomplete="off" ':opt.num?'type="number" step="'+opt.num+'" inputmode="decimal" ':'autocapitalize="off" autocorrect="off" spellcheck="false" ')+
    'placeholder="'+ph+'" value="'+esc(v)+'"></div>';

// ---------- 语音识别 / 视频识别 ----------
// 对外接口：startRecording() -> Promise<{stop():Promise<Blob>}>   开始录音，stop() 返回录音文件
//          transcribeAudio(blob) -> Promise<文字>                 语音转文字（用 Speech Recognition 设置）
//          describeVideo(file, 提问) -> Promise<文字>              视频截帧后交给 Image Recognition 设置识别
function apiUrl(a,p){return a.base.replace(/\/+$/,"")+p}
window.transcribeAudio=function(blob){
  var a=S.stt;
  if(!a.base||!a.key||!a.model)return Promise.reject(new Error("请先在 Settings 填写语音识别的 Base URL、API Key 和 Model"));
  var ext=/mp4|m4a|aac/.test(blob.type)?"m4a":/ogg/.test(blob.type)?"ogg":/wav/.test(blob.type)?"wav":"webm";
  var fd=new FormData();fd.append("file",blob,"voice."+ext);fd.append("model",a.model);if(a.lang)fd.append("language",a.lang);
  return fetch(apiUrl(a,"/audio/transcriptions"),{method:"POST",headers:{"Authorization":"Bearer "+a.key},body:fd})
  .then(function(r){return r.json().then(function(j){if(!r.ok||typeof j.text!=="string")throw new Error(JSON.stringify(j).slice(0,160));return j.text})});
};
window.startRecording=function(){
  if(!navigator.mediaDevices||!window.MediaRecorder)return Promise.reject(new Error("当前浏览器不支持录音"));
  return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mt=["audio/webm;codecs=opus","audio/webm","audio/mp4"].filter(function(t){return MediaRecorder.isTypeSupported(t)})[0];
    var rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream),chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    rec.start();
    return{stop:function(){return new Promise(function(res){
      rec.onstop=function(){stream.getTracks().forEach(function(t){t.stop()});res(new Blob(chunks,{type:rec.mimeType||mt||"audio/webm"}))};
      rec.stop();
    })}};
  });
};
function videoFrames(file,n,maxSide){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),v=document.createElement("video"),out=[];
    var fail=function(m){URL.revokeObjectURL(url);rej(new Error(m))};
    v.muted=true;v.playsInline=true;v.preload="auto";v.src=url;
    v.onerror=function(){fail("这个视频格式浏览器读不了")};
    v.onloadedmetadata=function(){
      var d=v.duration;if(!isFinite(d)||d<=0)return fail("读不到视频时长");
      var k=Math.max(1,Math.min(12,n)),i=0,c=document.createElement("canvas"),x=c.getContext("2d");
      var sc=Math.min(1,maxSide/Math.max(v.videoWidth,v.videoHeight));
      c.width=Math.round(v.videoWidth*sc)||1;c.height=Math.round(v.videoHeight*sc)||1;
      v.onseeked=function(){
        x.drawImage(v,0,0,c.width,c.height);out.push(c.toDataURL("image/jpeg",.7));i++;
        if(i>=k){URL.revokeObjectURL(url);res({frames:out,duration:d})}else v.currentTime=Math.min(d-.05,d*(i+.5)/k);
      };
      v.currentTime=Math.min(d-.05,d*.5/k);
    };
  });
}
window.describeVideo=function(file,prompt){
  var a=S.vision;
  if(!a.base||!a.key||!a.model)return Promise.reject(new Error("请先填写 Image Recognition 的 Base URL、API Key 和 Model"));
  return videoFrames(file,parseInt(a.frames,10)||6,640).then(function(r){
    var parts=[{type:"text",text:(prompt||"请描述这段视频里发生了什么。")+"\n（以下 "+r.frames.length+" 张图是从时长约 "+Math.round(r.duration)+" 秒的视频里按时间顺序均匀截取的画面）"}];
    r.frames.forEach(function(u){parts.push({type:"image_url",image_url:{url:u}})});
    return fetch(apiUrl(a,"/chat/completions"),{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+a.key},body:JSON.stringify({model:a.model,messages:[{role:"user",content:parts}],max_tokens:600})})
    .then(function(q){return q.json().then(function(j){if(!q.ok||!j.choices)throw new Error(JSON.stringify(j).slice(0,160));return String(j.choices[0].message.content||"")})});
  });
};

function callAI(c,list){

    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));return j})})

// ---------- Wallet ----------
// 对外接口（以后聊天页的礼物/转账直接调用）：
//   walletAdd("gift_in", 角色id, 金额)  角色送我礼物，余额增加
//   walletAdd("gift_out", 角色id, 金额) 我送角色礼物，余额减少（余额不足返回 false）
//   walletAdd("topup", "me", 金额)      我充值
//   getWallet() 读取余额和交易记录
var W={bal:0,hide:false,tx:[]};
try{var rw=store("wallet");if(rw){var w0=JSON.parse(rw);if(typeof w0.bal==="number")W.bal=w0.bal;W.hide=!!w0.hide;if(w0.tx&&w0.tx.length)W.tx=w0.tx}}catch(e){}
function saveW(){try{localStorage.setItem("wallet",JSON.stringify(W));return true}catch(e){toast("存储空间不足");return false}}
function r2(n){return Math.round(n*100)/100}
function money(n){return "£"+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
var EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.600-6.500 10-6.500S22 12 22 12s-3.600 6.500-10 6.500S2 12 2 12z"/><circle cx="12" cy="12" r="2.800"/></svg>';
var EYEOFF='<svg viewBox="0 0 24 24"><path d="M2 12s3.600-6.500 10-6.500S22 12 22 12s-3.600 6.500-10 6.500S2 12 2 12z"/><circle cx="12" cy="12" r="2.800"/><path d="M4 4l16 16"/></svg>';
var WALI='<svg viewBox="0 0 24 24"><path d="M4 7.500A2.500 2.500 0 016.500 5H18a1 1 0 011 1v2"/><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="16.500" cy="14" r="1.200"/></svg>';
window.walletAdd=function(kind,charId,amount,note){
  amount=r2(+amount);if(!(amount>0)||amount>99999)return false;
  if(kind!=="topup"&&kind!=="gift_in"&&kind!=="gift_out")return false;
  var signed=kind==="gift_out"?-amount:amount;
  if(W.bal+signed<0)return false;
  W.bal=r2(W.bal+signed);
  W.tx.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),char:charId||"me",kind:kind,amt:signed,note:note||"",t:Date.now()});
  if(!saveW()){W.tx.shift();W.bal=r2(W.bal-signed);return false}
  var pg=$("#pgWallet");if(pg&&!pg.hidden)renderWallet();
  return true;
};
// getWallet() 读全部；getWallet(角色id) 只读我和该角色之间的礼物记录（Char 读取时用这个）
window.getWallet=function(charId){
  var tx=charId?W.tx.filter(function(x){return x.char===charId&&x.kind!=="topup"}):W.tx.slice();
  return{balance:W.bal,transactions:tx.map(function(x){return{kind:x.kind,amount:x.amt,note:x.note||"",date:ymd(new Date(x.t)),char:x.char}})};
};
function wRow(x){
  var me=x.kind==="gift_out"||x.char==="me",a=me?{name:"You",avatar:P.avatar}:who(x.char),desc;
  if(x.kind==="gift_in")desc="Received a gift";
  else if(x.kind==="gift_out")desc="Sent a gift"+(x.char&&x.char!=="me"?" to "+who(x.char).name:"");
  else desc="Top up";
  return '<div class="item wrow"><div class="avatar">'+avh(a.avatar)+'</div><div class="body"><div class="t">'+esc(a.name)+'</div><div class="p">'+esc(desc+(x.note?" · "+x.note:""))+'</div></div>'+
    '<div class="wr"><div class="wa">'+(x.amt>0?"+ ":"- ")+money(x.amt)+'</div><div class="wd">'+mdLabel(ymd(new Date(x.t)))+'</div></div></div>';
}
function renderWallet(){
  var rows=W.tx.map(wRow).join("");
  $("#pgWallet").innerHTML='<div class="ctop"><button class="circle" id="wBack" aria-label="返回">'+BACK+'</button></div>'+
    '<div class="svhead"><div class="svtx"><h1>My<br>Wallet</h1><p>Manage your balance and transactions.</p></div><div class="svico">'+WALI+'</div></div>'+
    '<div class="wbal"><div><div class="wlab"><span>Total Balance</span><button id="wEye" aria-label="显示/隐藏">'+(W.hide?EYEOFF:EYE)+'</button></div><div class="wamt">'+(W.hide?"$ ••••":money(W.bal))+'</div></div><button class="wtop" id="wTop">Top Up</button></div>'+

// ---------- Album 相册 ----------
// 对外接口：getAlbum(角色id) 取该角色相册 [{id,desc,t}]
//          setAvatarFromAlbum(角色id,照片id,回调) 把相册里的某张图设为该角色头像（以后想让 AI 按描述挑图，就用这两个）
// 图片存在 IndexedDB（不占 localStorage 的空间），文字描述和设置存在 localStorage 的 albums
var ALB={};try{ALB=JSON.parse(store("albums")||"{}")||{}}catch(e){}
function saveAlb(){try{localStorage.setItem("albums",JSON.stringify(ALB));return true}catch(e){toast("存储空间不足");return false}}
function alb(cid){if(!ALB[cid])ALB[cid]={auto:true,chance:20,last:"",cur:"",items:[]};return ALB[cid]}
window.getAlbum=function(cid){return(ALB[cid]&&ALB[cid].items||[]).map(function(x){return{id:x.id,desc:x.desc,t:x.t}})};
var AV={view:"home",cid:""},AP=[],AO="",THUMB={};
function squareFrom(url,cb){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=400;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,400,400);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,400,400);cb(c.toDataURL("image/jpeg",.85))};im.src=url}
window.setAvatarFromAlbum=function(cid,pid,cb){
  var c=cget(cid);if(!c){cb&&cb(false);return}
  idbGet("alb:"+pid,function(e,url){
    if(e||!url){cb&&cb(false);return}
    squareFrom(url,function(av){var old=c.avatar;c.avatar=av;if(!saveContacts()){c.avatar=old;cb&&cb(false);return}alb(cid).cur=pid;saveAlb();cb&&cb(true)});
  });
};
// 每天最多检查一次：按每个角色设置的几率，从相册里随机挑一张换头像
function albumTick(){
  var d=new Date(),today=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  contacts.forEach(function(c){
    var a=ALB[c.id];if(!a||a.auto===false||!a.items.length||a.last===today)return;
    a.last=today;saveAlb();
    if(Math.random()*100>=(+a.chance||0))return;
    var pool=a.items.filter(function(x){return x.id!==a.cur});if(!pool.length)return;
    var p=pool[Math.floor(Math.random()*pool.length)];
    window.setAvatarFromAlbum(c.id,p.id,function(ok){if(ok){toast(nick(c)+" 换了新头像");renderList();var pg=$("#pgContacts");if(pg&&!pg.hidden)renderContacts()}});
  });
}

  root.querySelectorAll("img[data-tid]").forEach(function(im){
    var id=im.dataset.tid;if(THUMB[id]){im.src=THUMB[id];return}
    idbGet("albt:"+id,function(e,u){if(u){THUMB[id]=u;im.src=u}});
  });
}
function renderAlbum(){
  var el=$("#pgAlbum"),h;
  if(AV.view==="home"){
    h='<div class="sTitle"><button class="circle" id="alBack" aria-label="返回">'+BACK+'</button><h1>Albums</h1></div>';

// ---------- Relationships 关系网 ----------
// 数据：REL=[{id,a,b,label,back,note}]，a / b 是角色 id，"me" 代表你自己
// label = A 是 B 的什么；back = B 是 A 的什么（留空表示双方一样）
// 对外接口：getRelations(id) 取某人（"me" 或角色id）的所有关系，之后写聊天提示词时用
var REL=[];try{REL=JSON.parse(store("relations")||"[]")||[]}catch(e){}
function saveRel(){try{localStorage.setItem("relations",JSON.stringify(REL));return true}catch(e){toast("存储空间不足");return false}}
function relName(id){if(id==="me")return P.name||"Me";var c=cget(id);return c?nick(c):""}
function relOk(id){return id==="me"||!!cget(id)}
window.getRelations=function(id){
  return REL.filter(function(r){return r.a===id||r.b===id}).map(function(r){
    var self=r.a===id,o=self?r.b:r.a;
    return{with:o,withName:relName(o),selfRole:self?r.label:(r.back||r.label),otherRole:self?(r.back||r.label):r.label,note:r.note||""};
  });
};
function relLabel(r){return(r.label||"…")+(r.back&&r.back!==r.label?" / "+r.back:"")}
function relGraph(){
  var ids=contacts.map(function(c){return c.id}),cx=180,cy=190,R=125,pos={me:{x:cx,y:cy}},g="",t="",n="",i=0;
  ids.forEach(function(id,k){var a=-Math.PI/2+2*Math.PI*k/ids.length;pos[id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}});
  REL.forEach(function(r){
    var p=pos[r.a],q=pos[r.b];if(!p||!q)return;
    g+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+q.x+'" y2="'+q.y+'" style="stroke:var(--sub);stroke-width:1.4;opacity:.55"/>';
    t+='<text x="'+(p.x+q.x)/2+'" y="'+((p.y+q.y)/2+3)+'" text-anchor="middle" style="fill:var(--sub);font-size:10px;font-weight:700;stroke:var(--bg);stroke-width:4px;paint-order:stroke">'+esc(relLabel(r).slice(0,12))+'</text>';
  });
  ["me"].concat(ids).forEach(function(id){
    var p=pos[id],nm=relName(id),c=id==="me"?null:cget(id),av=id==="me"?P.avatar:(c&&c.avatar);i++;
    n+=(id==="me"?'<circle cx="'+p.x+'" cy="'+p.y+'" r="31" style="fill:none;stroke:var(--text);stroke-width:1.5"/>':'')+
      '<circle cx="'+p.x+'" cy="'+p.y+'" r="27" style="fill:var(--av)"/>'+
      (av?'<clipPath id="rcp'+i+'"><circle cx="'+p.x+'" cy="'+p.y+'" r="26"/></clipPath><image href="'+av+'" x="'+(p.x-26)+'" y="'+(p.y-26)+'" width="52" height="52" preserveAspectRatio="xMidYMid slice" clip-path="url(#rcp'+i+')"/>'
        :'<text x="'+p.x+'" y="'+(p.y+6)+'" text-anchor="middle" style="fill:#fff;font-size:17px;font-weight:800">'+esc((nm||"?").slice(0,1).toUpperCase())+'</text>')+
      '<text x="'+p.x+'" y="'+(p.y+46)+'" text-anchor="middle" style="fill:var(--text);font-size:11px;font-weight:700">'+esc(nm.slice(0,8))+'</text>';
  });
  return '<svg class="rgraph" viewBox="0 0 360 385">'+g+t+n+'</svg>';
}
function renderRel(){
  REL=REL.filter(function(r){return relOk(r.a)&&relOk(r.b)});
  var h='<div class="sTitle"><button class="circle" id="rlBack" aria-label="返回">'+BACK+'</button><h1>Relationships</h1></div>'+relGraph()+
    '<button class="addpill" id="rlAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add Relationship</span></button>';
  h+=REL.length?REL.map(function(r){
    return '<button class="item" data-rid="'+r.id+'" style="margin-top:8px"><div class="body"><div class="t">'+esc(relName(r.a))+' · '+esc(relName(r.b))+'</div><div class="p">'+esc(relLabel(r)+(r.note?" — "+r.note:""))+'</div></div></button>';
  }).join(""):'<div class="empty" style="margin-top:30px">还没有关系<br>点上面添加，比如你和某个角色，或者角色之间</div>';

function sysNotify(title,body,tag){
  if(!("Notification" in window)||Notification.permission!=="granted")return false;
  var opt={body:body,tag:tag||"chat"};
  var fb=function(){try{new Notification(title,opt)}catch(e){}};
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(function(reg){if(reg&&reg.showNotification)reg.showNotification(title,opt);else fb()}).catch(fb);
  }else fb();
  return true;
}

// ---------- Keep Alive 后台音频保活 ----------
// Silent：循环播放几乎无声的音频；Audible：循环播放你自己选的音频文件（存在浏览器里），开启后优先于 Silent
var KA={silent:false,audible:false,vol:50,file:""};
try{var rka=store("keepalive");if(rka)Object.assign(KA,JSON.parse(rka))}catch(e){}
function saveKA(){store("keepalive",JSON.stringify(KA))}
function idbOpen(cb){try{var r=indexedDB.open("chatpwa",1);r.onupgradeneeded=function(){r.result.createObjectStore("files")};r.onsuccess=function(){cb(null,r.result)};r.onerror=function(){cb(r.error||1)}}catch(e){cb(e)}}
function idbPut(k,v,done){idbOpen(function(e,db){if(e)return done(e);var tx=db.transaction("files","readwrite");tx.objectStore("files").put(v,k);tx.oncomplete=function(){done(null)};tx.onerror=function(){done(tx.error||1)}})}
function idbGet(k,done){idbOpen(function(e,db){if(e)return done(e);var rq=db.transaction("files").objectStore("files").get(k);rq.onsuccess=function(){done(null,rq.result)};rq.onerror=function(){done(rq.error||1)}})}
function idbDel(k,done){idbOpen(function(e,db){if(e)return done&&done(e);var tx=db.transaction("files","readwrite");tx.objectStore("files").delete(k);tx.oncomplete=function(){done&&done(null)}})}
var kaEl=null,kaMode="",kaUrl={silent:"",file:""};
idbGet("keepalive-file",function(e,blob){
  if(!e&&blob){kaUrl.file=URL.createObjectURL(blob)}
  else if(KA.file){KA.file="";KA.audible=false;saveKA()}
});
function makeSilentWav(){
  var rate=8000,n=rate*2,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  function ws(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
  ws(0,"RIFF");v.setUint32(4,36+n*2,true);ws(8,"WAVE");ws(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,"data");v.setUint32(40,n*2,true);
  for(var i=0;i<n;i++)v.setInt16(44+i*2,i%2?1:-1,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
function kaWant(){return KA.audible&&kaUrl.file?"file":KA.silent?"silent":""}
function kaStatus(){var w=kaWant();return !w?"Off":(kaEl&&!kaEl.paused?"Running · "+(w==="file"?"audible":"silent"):"Tap to start")}
function kaApply(){
  var want=kaWant();
  if(!want){if(kaEl)kaEl.pause();kaMode="";try{if("mediaSession" in navigator)navigator.mediaSession.playbackState="none"}catch(e){}return Promise.resolve()}
  if(!kaEl){kaEl=document.createElement("audio");kaEl.loop=true;kaEl.preload="auto";kaEl.setAttribute("playsinline","");kaEl.style.display="none";document.body.appendChild(kaEl)}
  if(kaMode!==want){kaEl.src=want==="silent"?(kaUrl.silent||(kaUrl.silent=makeSilentWav())):kaUrl.file;kaMode=want}
  kaEl.volume=want==="file"?KA.vol/100:1;
  try{if("mediaSession" in navigator&&window.MediaMetadata){navigator.mediaSession.metadata=new MediaMetadata({title:"Chats",artist:"Keep alive"});navigator.mediaSession.playbackState="playing"}}catch(e){}
  var pr=kaEl.play();
  return pr&&pr.then?pr.then(function(){},function(){}):Promise.resolve();
}
function kaSetHTML(){
  return '<div class="sgrp">Keep Alive</div><div class="card">'+
    '<div class="fl"><div class="srow" style="cursor:default"><b>Status</b><span class="v">'+kaStatus()+'</span></div></div>'+
    '<div class="fl"><button class="srow" id="kaSilent"><b>Silent audio</b><i class="sw'+(KA.silent?' on':'')+'"></i></button></div>'+
    '<div class="fl"><button class="srow" id="kaAud"><b>Audible audio</b><i class="sw'+(KA.audible?' on':'')+'"></i></button></div>'+
    '<div class="fl"><button class="srow" id="kaFile"><b>Audio file</b><span class="v">'+esc(KA.file||"Choose…")+'</span></button></div>'+
    '<div class="fl"><label style="font-size:13px;color:var(--sub);margin-bottom:8px">Volume · '+KA.vol+'%</label><input type="range" id="kaVol" min="0" max="100" value="'+KA.vol+'" style="width:100%"></div></div>'+
    (KA.file?'<button class="ghost" id="kaRm">Remove file</button>':'')+
    '<div class="hint" style="word-break:normal">在后台循环播放音频，让页面尽量不被系统冻结。Silent 播放几乎听不见的循环音；Audible 播放你选的音频文件，开启后优先于 Silent。需要先点一下开关才能开始播放；更耗电，锁屏界面可能出现播放控件。效果因系统而异，不保证一直有效。</div>';
}
$("#pgSet").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var re=function(){renderSettings()};
  if(b.id==="kaSilent"){KA.silent=!KA.silent;saveKA();kaApply().then(re);return}
  if(b.id==="kaAud"){
    if(!KA.audible&&!kaUrl.file){toast("先选择一个音频文件");return}
    KA.audible=!KA.audible;saveKA();kaApply().then(re);return;
  }
  if(b.id==="kaFile"){
    var inp=document.createElement("input");inp.type="file";inp.accept="audio/*";
    inp.onchange=function(){
      var f=inp.files[0];if(!f)return;
      if(f.size>20*1048576){toast("文件太大，请选 20MB 以内");return}
      idbPut("keepalive-file",f,function(err){
        if(err){toast("保存失败，这个浏览器可能不支持");return}
        if(kaUrl.file)URL.revokeObjectURL(kaUrl.file);
        kaUrl.file=URL.createObjectURL(f);KA.file=f.name;saveKA();
        if(kaMode==="file"){kaMode=""}
        toast("已选择："+f.name);renderSettings();
      });
    };inp.click();return;
  }
  if(b.id==="kaRm"){
    idbDel("keepalive-file");if(kaUrl.file)URL.revokeObjectURL(kaUrl.file);kaUrl.file="";KA.file="";KA.audible=false;saveKA();
    kaMode="";kaApply().then(re);toast("已移除");return;
  }
});
$("#pgSet").addEventListener("input",function(e){

function mapSVG(seed){
  var h=0,t=String(seed||"");for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;h=Math.abs(h);
  var a=20+h%50,b=120+(h>>3)%60,c=22+(h>>5)%40,d=58+(h>>7)%26;
  return '<svg viewBox="0 0 220 110" preserveAspectRatio="xMidYMid slice" style="display:block;width:100%;height:110px;background:var(--fill)"><path d="M0 '+(82-h%12)+' Q60 '+(58+h%20)+' 120 84 T220 70" fill="none" stroke="var(--av)" stroke-width="10" opacity=".55"/><rect x="'+(a+34)+'" y="'+(c+14)+'" width="40" height="22" rx="7" fill="var(--av)" opacity=".4"/><g fill="none" stroke="var(--bg)" stroke-linecap="round"><path d="M-10 '+c+' L230 '+(c+22)+'" stroke-width="7"/><path d="M-10 '+(d+30)+' L230 '+(d+10)+'" stroke-width="5"/><path d="M'+a+' -10 L'+(a+18)+' 120" stroke-width="7"/><path d="M'+b+' -10 L'+(b-20)+' 120" stroke-width="5"/></g><g transform="translate(110 42)"><path d="M0 24C-10 12-14 6-14-1a14 14 0 0128 0c0 7-4 13-14 25z" fill="var(--text)"/><circle cx="0" cy="-1" r="5" fill="var(--bg)"/></g></svg>';
}

var MICSVG='<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0013 0M12 17.500V21"/></svg>';
var PLAYSVG='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSESVG='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function fmtDur(n){n=Math.max(0,Math.round(n||0));return Math.floor(n/60)+":"+("0"+(n%60)).slice(-2)}
function barsHTML(seed){
  var h=0,t=String(seed||"x");for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;h=Math.abs(h);
  var o="";for(var k=0;k<14;k++){o+='<i style="height:'+(6+((h>>((k*2)%24))&15)*1.1)+'px"></i>'}
  return o;
}
function vtShow(m){var o=chsGet(CUR);return m.vt!==undefined?!!m.vt:(m.by==="me"?!!o.vtMe:!!o.vtChar)}
function voiceBubble(m){
  var tx=String(m.text||"").replace(/^\[Voice( message)?\]\s*/,""),show=vtShow(m);
  return '<div class="vrow"><button class="vbtn" data-vp="'+m.id+'" aria-label="播放">'+PLAYSVG+'</button><span class="vbars">'+barsHTML(m.id)+'</span><span class="vdur">'+fmtDur(m.dur)+'</span>'+(tx?'<button class="vtg'+(show?' on':'')+'" data-vt="'+m.id+'" aria-label="显示或隐藏文字">Aa</button>':'')+'</div>'+(tx&&show?'<div class="vtx">'+esc(tx)+'</div>':'');

function playVoice(src,btn){
  if(VA&&VAbtn===btn){VA.pause();VA=null;btn.innerHTML=PLAYSVG;VAbtn=null;return}
  if(VA){VA.pause();if(VAbtn)VAbtn.innerHTML=PLAYSVG}
  VA=new Audio(src);VAbtn=btn;btn.innerHTML=PAUSESVG;
  var a=VA;a.onended=function(){if(VA===a){btn.innerHTML=PLAYSVG;VA=null;VAbtn=null}};
  a.play().catch(function(){toast("无法播放这段语音");btn.innerHTML=PLAYSVG;VA=null;VAbtn=null});
}

function vcAbort(){
  VC.tok++;
  if(VC.tm){clearInterval(VC.tm);VC.tm=null}
  if(VC.rec){var r=VC.rec;VC.rec=null;r.stop().catch(function(){})}
  if(VA){VA.pause();VA=null;VAbtn=null}
}

function vcView(st,info){
  var h;
  if(st==="idle")h='<div class="plt">Voice message</div><button class="vcBig" id="vcRec" aria-label="开始录音">'+MICSVG+'</button><div class="vcHint">点一下开始录音，最长 60 秒。录完会自动转成文字，你发出后也可以点开重听</div>';
  else if(st==="rec")h='<div class="plt">Recording…</div><button class="vcBig rec" id="vcStop" aria-label="停止录音">'+MICSVG+'</button><div class="vcTime" id="vcTime">0:00</div><div class="vcHint">再点一下结束</div>';
  else if(st==="proc")h='<div class="plt">Transcribing…</div><div class="vcBig" style="opacity:.5">'+MICSVG+'</div><div class="vcHint">正在把语音转成文字</div>';
  else h='<div class="plt">Voice message</div><div class="vcPrev"><button class="vbtn" id="vcPrev" aria-label="试听">'+PLAYSVG+'</button><span class="vbars">'+barsHTML(VC.dur+"p")+'</span><span class="vdur">'+fmtDur(VC.dur)+'</span></div>'+
    '<div class="card" style="margin-top:12px"><label>Transcript</label><textarea class="tall" id="vcText" maxlength="500" placeholder="没有识别到文字，可以手动填写，也可以留空直接发送">'+esc(info.text)+'</textarea></div>'+
    (info.err?'<div class="vcHint" style="text-align:left;margin:8px 4px 0">语音识别失败：'+esc(info.err)+'</div>':'')+
    '<button class="pillbtn" id="vcSend" style="margin-top:14px">Send</button><button class="pillbtn" id="vcRetake" style="margin-top:8px">Record again</button>';
  openAct(h);
}
function vcStart(){
  window.startRecording().then(function(r){
    VC.rec=r;VC.t0=Date.now();vcView("rec");
    VC.tm=setInterval(function(){
      var sec=(Date.now()-VC.t0)/1000,el=$("#vcTime");if(el)el.textContent=fmtDur(sec);
      if(sec>=60)vcStop();
    },250);
  }).catch(function(e){toast("无法使用麦克风："+String(e.message||e).slice(0,50))});
}
function vcStop(){
  if(!VC.rec)return;
  var r=VC.rec;VC.rec=null;clearInterval(VC.tm);VC.tm=null;
  VC.dur=Math.max(1,Math.round((Date.now()-VC.t0)/1000));
  var my=++VC.tok;vcView("proc");
  r.stop().then(function(blob){
    if(my!==VC.tok)return;
    if(Date.now()-VC.t0<900||!blob.size){toast("说话时间太短");vcView("idle");return}
    var rd=new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result)};f.onerror=function(){rej(new Error("读取录音失败"))};f.readAsDataURL(blob)});
    var tr=window.transcribeAudio(blob).then(function(t){return{text:String(t||"").trim()}}).catch(function(e){return{text:"",err:String(e.message||e).slice(0,100)}});
    return Promise.all([rd,tr]).then(function(a){
      if(my!==VC.tok)return;
      VC.url=a[0];vcView("review",a[1]);
    });
  }).catch(function(e){if(my===VC.tok){toast("录音失败："+String(e.message||e).slice(0,50));vcView("idle")}});
}
$("#actSheet").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="vcRec")vcStart();
  else if(b.id==="vcStop")vcStop();
  else if(b.id==="vcRetake"){if(VA){VA.pause();VA=null;VAbtn=null}vcView("idle")}
  else if(b.id==="vcPrev"){playVoice(VC.url,b)}
  else if(b.id==="vcSend"){
    var tx=($("#vcText").value||"").trim(),url=VC.url,dur=VC.dur;
    if(VA){VA.pause();VA=null;VAbtn=null}
    closeAct();
    sendMedia({type:"voice",audio:url,dur:dur,text:tx?"[Voice] "+tx:"[Voice message]"});
  }
});

function trVisible(m){var o=chsGet(CUR);return m.trShow!==undefined?m.trShow:(!!o.trOpen&&!!m.tr)}
function trBlock(m){if(!trVisible(m))return"";return'<div class="trb">'+(m.tr?esc(m.tr):(m.trErr?"翻译失败，点气泡重试":"翻译中…"))+'</div>'}
function callTranslate(text,lang){
  var a=S.api;
  if((a.base||"").trim().toLowerCase()==="demo")return new Promise(function(r){setTimeout(function(){r("（演示翻译）"+text)},500)});
  if(!a.base||!a.key||!a.model)return Promise.reject(new Error("请先在 Settings 里填写 Chat API"));
  var body={model:a.model,messages:[{role:"system",content:"Translate the user's message into "+lang+". Output only the translation, with no explanations or quotation marks."},{role:"user",content:text}],temperature:0.2,max_tokens:600};
  return fetch(apiUrl(a,"/chat/completions"),{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+a.key},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));return j})})
    .then(function(j){var t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!t)throw new Error("接口没有返回内容");return String(t).replace(/<think>[\s\S]*?(<\/think>|$)/gi,"").trim()});
}
function doTr(id,m){
  if(m.tr||m.trBusy)return;
  m.trBusy=true;delete m.trErr;
  callTranslate(m.text,chsGet(id).trLang||"中文").then(function(t){m.tr=t}).catch(function(e){m.trErr=1;toast(String(e.message||e).slice(0,80),3500)})
    .then(function(){delete m.trBusy;saveChats();if(CUR===id&&!$("#pgChat").hidden)renderChat(true)});
}
function autoTr(id,m){m.trShow=true;doTr(id,m)}

  if(show&&!m.tr){m.trErr&&delete m.trErr;renderChat(true);doTr(CUR,m)}else renderChat(true);
});

function chsGet(id){var o=CHS[id]||(CHS[id]={});for(var k in CHD)if(o[k]===undefined)o[k]=(typeof CHD[k]==="object")?JSON.parse(JSON.stringify(CHD[k])):CHD[k];return o}

function chsPrompt(id){
  var o=chsGet(id),r=[];
  function tn(tz){try{return new Date().toLocaleString("en-US",{timeZone:tz||undefined,dateStyle:"medium",timeStyle:"short"})}catch(e){return ""}}
  var tl=[];
  if(o.charTz)tl.push("Your local time: "+tn(o.charTz)+" ("+o.charTz+")");
  if(o.userTz)tl.push("The user's local time: "+tn(o.userTz)+" ("+o.userTz+")");
  if(tl.length)r.push("[Time Zones]\n"+tl.join("\n"));
  var pl=[];
  if(o.charRegion)pl.push("You are in: "+o.charRegion);
  if(o.userRegion)pl.push("The user is in: "+o.userRegion);
  if(pl.length)r.push("[Places]\n"+pl.join("\n"));
  if(o.charLang)r.push("[Language]\nWrite your messages in "+o.charLang+".");
  if(o.cot)r.push("[Reasoning]\n- Before every reply, think it through privately inside <think>...</think>: who you are, how you usually talk, what you remember, what the user really means, and how you would naturally respond.\n- Put your actual messages after </think>. Never mention or quote your reasoning in the messages.");
  var a=Math.min(o.outMin,o.outMax),b=Math.max(o.outMin,o.outMax);
  r.push("[Output Rhythm]\n- Each reply should contain between "+a+" and "+b+" separate messages.");
  return r;
}
var sumBusy={};
function summarize(cid,manual){
  var o=chsGet(cid),c=cget(cid),list=msgs(cid),a=S.api;
  var seg=list.slice(Math.min(o.ltmAt||0,list.length));
  if(!c||seg.length<2){if(manual)toast("还没有新的聊天可以总结");return Promise.resolve(false)}
  if(sumBusy[cid])return Promise.resolve(false);
  var cap=Math.max(50,parseInt(o.ltmCap)||500),demo=(a.base||"").trim().toLowerCase()==="demo";
  if(!demo&&(!a.base||!a.key||!a.model)){if(manual)toast("请先在 Settings 填写 Chat API");return Promise.resolve(false)}
  sumBusy[cid]=1;
  var convo=seg.map(function(m){return(m.by==="me"?P.name:nick(c))+": "+m.text}).join("\n").slice(-12000);
  var job=demo?new Promise(function(r){setTimeout(function(){r("（演示）这里会是 "+seg.length+" 条聊天的核心记忆总结。")},800)}):
    fetch(apiUrl(a,"/chat/completions"),{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+a.key},body:JSON.stringify({model:a.model,temperature:0.3,max_tokens:Math.min(4000,cap*3),messages:[
      {role:"system",content:"You write the long-term memory of "+nick(c)+". Summarize the conversation below into core memory from "+nick(c)+"'s point of view: key facts about the user, promises, shared events, feelings and preferences. Plain text, no preamble, no markdown. Hard limit: at most "+cap+" characters. Write in the language the conversation mostly uses."},
      {role:"user",content:convo}]})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));return j})})
    .then(function(j){var t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!t)throw new Error("空回复");return String(t)});
  return job.then(function(t){
    t=t.replace(/<think>[\s\S]*?(<\/think>|$)/gi,"").trim().slice(0,cap);
    if(!t)throw new Error("空回复");
    if(MT.indexOf("Summary")<0)MT.push("Summary");
    (MEM[cid]||(MEM[cid]=[])).unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:"Summary",text:t,t:Date.now()});
    saveMem();o.ltmAt=list.length;saveCHS();
    if(manual)toast("已生成并存入 Memory");
    return true;
  }).catch(function(e){if(manual)toast("总结失败："+String(e.message||e).slice(0,60));return false})
  .then(function(ok){delete sumBusy[cid];return ok});
}
function ltmCheck(id){var o=chsGet(id);if(o.ltm&&msgs(id).length-(o.ltmAt||0)>=(parseInt(o.ltmEvery)||90))summarize(id,false)}
function estTok(t){t=String(t||"");var cj=(t.match(/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/g)||[]).length;return Math.round(cj*1.1+(t.length-cj)/4)}
function estRound(c){
  var list=msgs(c.id),n=Math.max(2,parseInt(chsGet(c.id).mem)||150),t=0;
  try{t+=estTok(buildSystem(c,list))}catch(e){}
  list.slice(-n).forEach(function(m){t+=estTok(m.text)+4});
  return t;
}

$("#pgChset").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  var o=chsGet(CUR);
  if(b.id==="chsBack"){go("chat");applyChatBg();renderChat(true);updateSend();return}
  if(b.dataset.sg){var pk=b.parentNode.dataset.sgk;o[pk]=b.dataset.sg;[].forEach.call(b.parentNode.children,function(x){x.classList.toggle("on",x===b)});saveCHS();return}
  if(b.dataset.bm){o.arMode=b.dataset.bm;saveCHS();$("#arBox").innerHTML=arHTML();return}
  if(b.dataset.ct){var k=b.dataset.ct;o[k]=!o[k];b.querySelector(".sw").classList.toggle("on",o[k]);saveCHS();if(k==="blocked")toast(o[k]?"已拉黑":"已取消拉黑");return}
  if(b.dataset.wb){
    var id=b.dataset.wb,x=null;WB.items.forEach(function(i){if(i.id===id)x=i});if(!x)return;
    var on;
    if(x.scope==="global"){var ix=o.wbOff.indexOf(id);if(ix>-1)o.wbOff.splice(ix,1);else o.wbOff.push(id);on=o.wbOff.indexOf(id)<0;saveCHS()}
    else{x.chars=x.chars||[];var jx=x.chars.indexOf(CUR);if(jx>-1)x.chars.splice(jx,1);else x.chars.push(CUR);on=x.chars.indexOf(CUR)>-1;saveWB()}
    b.querySelector(".sw").classList.toggle("on",on);return;
  }
  if(b.dataset.ca==="sumnow"){b.disabled=true;b.textContent="Summarizing…";summarize(CUR,true).then(function(){if(!$("#pgChset").hidden)renderChSet()});return}
  if(b.dataset.ca==="bgpick"){
    var bi=document.createElement("input");bi.type="file";bi.accept="image/*";
    bi.onchange=function(){if(bi.files[0])shrink(bi.files[0],1000,false,function(d){var old=o.chBg;o.chBg=d;if(!saveCHS()){o.chBg=old;return}toast("已更换聊天背景");renderChSet()})};
    bi.click();return;
  }
  if(b.dataset.ca==="bgrm"){o.chBg="";saveCHS();toast("已恢复默认背景");renderChSet();return}
  if(b.dataset.ca==="edit"){openForm(CUR);return}
  if(b.dataset.ca==="clear"){
    if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Tap again to clear";b.style.color="#e5484d";return}
    chats[CUR]=[];chsGet(CUR).ltmAt=0;saveCHS();saveChats();toast("已清空聊天");renderChSet();
  }
};
$("#pgChset").oninput=function(e){
  if(e.target.dataset.ar!==undefined){var oo=chsGet(CUR);oo.ar[oo.arMode][+e.target.dataset.ar]=e.target.value.trim();saveCHS();return}
  var f=e.target.dataset.cf;if(!f)return;
  var o=chsGet(CUR),v=e.target.value;
  if(f==="charTz"||f==="userTz"){o[f]=v.trim();var n=$("#tzn_"+f);if(n)n.textContent=tzOk(o[f]||undefined)?tzNow(o[f]):"";saveCHS();return}
  if(e.target.type==="number"){var n2=parseInt(v,10);if(isNaN(n2))return;
    var lim={ltmEvery:[10,1000],ltmCap:[50,3000],mem:[2,1000],bgMin:[1,1440],outMin:[1,20],outMax:[1,20]}[f]||[1,9999];
    o[f]=Math.max(lim[0],Math.min(lim[1],n2));saveCHS();return}
  o[f]=v.trim();saveCHS();
};
$("#pgChset").onchange=function(e){
  var f=e.target.dataset.cf;if(!f)return;
  var o=chsGet(CUR);
  if((f==="charTz"||f==="userTz")&&o[f]&&!tzOk(o[f])){toast("时区格式不对，例如 Asia/Tokyo");o[f]="";e.target.value="";var n=$("#tzn_"+f);if(n)n.textContent=tzNow("");saveCHS();return}
  if(e.target.type==="number"){e.target.value=o[f]}
  if(f==="outMin"&&o.outMin>o.outMax){o.outMax=o.outMin;saveCHS();renderChSet()}
  if(f==="outMax"&&o.outMax<o.outMin){o.outMin=o.outMax;saveCHS();renderChSet()}
};

// ---------- avatar ring tint ----------
(function(){
  var cache={};
  function sample(src,cb){
    if(cache[src]){cb(cache[src]);return}
    var im=new Image();
    im.onload=function(){
      try{
        var c=document.createElement("canvas");c.width=c.height=8;var x=c.getContext("2d");
        x.drawImage(im,0,0,8,8);var d=x.getImageData(0,0,8,8).data,a=[0,0,0,0],b=[0,0,0,0];
        for(var i=0;i<64;i++){var px=i%8,py=(i/8)|0,t=(px+py<8)?a:b;t[0]+=d[i*4];t[1]+=d[i*4+1];t[2]+=d[i*4+2];t[3]++}
        function f(t){return "rgb("+Math.round(t[0]/t[3])+","+Math.round(t[1]/t[3])+","+Math.round(t[2]/t[3])+")"}
        cache[src]=[f(a),f(b)];cb(cache[src]);
      }catch(e){}
    };
    im.src=src;
  }
  function apply(){
    document.querySelectorAll(".bnAv .avatar,.cvIn .avatar,.cpav .avatar,.pfav").forEach(function(el){
      var im=el.querySelector("img");
      if(!im){if(el.dataset.tint){el.dataset.tint="";el.style.removeProperty("--r1");el.style.removeProperty("--r2")}return}
      var src=im.getAttribute("src");if(!src||el.dataset.tint===src)return;
      el.dataset.tint=src;
      sample(src,function(c){el.style.setProperty("--r1",c[0]);el.style.setProperty("--r2",c[1])});
    });
  }
  var app=document.querySelector(".app");
  if(app)new MutationObserver(function(){requestAnimationFrame(apply)}).observe(app,{childList:true,subtree:true});
  apply();
})();
</script>
